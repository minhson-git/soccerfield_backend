spring.application.name=soccerfield-api
spring.config.import=optional:file:./.env[.properties]

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soccer_field_data}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
jwt.signer-key=${JWT_SIGNER_KEY}
jwt.issuer=soccerfield-api
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=7

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allow-credentials=true
app.cors.max-age=3600

# --- Bootstrap Admin ---
# --- Bootstrap (bỏ trống thì không tạo admin) ---
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}